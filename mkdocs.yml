site_name: CodeStudio JEV SDK
site_description: TypeScript and Python SDKs for the CodeStudio JEV Decisions API
site_url: https://praveen-hari.github.io/codestudio-jev-sdk/
repo_url: https://github.com/praveen-hari/codestudio-jev-sdk
repo_name: praveen-hari/codestudio-jev-sdk
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Praveen Hari

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Software development automation: guides/software-development.md
      - Authentication and security: guides/authentication.md
  - REST API:
      - Overview: api/index.md
      - Request schema: api/request.md
      - Responses and errors: api/response.md
      - Detailed usage: api-usage.md
  - SDK reference:
      - Overview: sdk/index.md
      - TypeScript: sdk/typescript.md
      - Python: sdk/python.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/praveen-hari/codestudio-jev-sdk
  version:
    provider: mike

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
